<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Manajemen - BUMKal Srihardono</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between font-sans select-none">

    <!-- Tempat Layout di Root Dimuat -->
    <div id="layout-container" class="contents"></div>

    <!-- KONTEN UTAMA MANAJEMEN (Menggunakan id="spaAppContainer" agar terbaca oleh layout.html) -->
    <div id="spaAppContainer">
        <div class="space-y-6 max-w-6xl mx-auto w-full p-2">
            <div>
                <h2 class="text-xl font-bold text-slate-900 tracking-tight">Pengaturan & Manajemen</h2>
                <p class="text-xs text-slate-500 mt-0.5">Pilih menu di bawah ini untuk mengelola data operasional dan konten aplikasi BUMKal Srihardono.</p>
            </div>

            <!-- Grid Menu Kotak-Kotak -->
            <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-4">
                
                <!-- Manajemen Promo -->
                <div onclick="alert('Navigasi ke Manajemen Promo')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-tag"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Manajemen Promo</h3>
                    </div>
                </div>

                <!-- Manajemen Event -->
                <div onclick="alert('Navigasi ke Manajemen Event')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-calendar-days"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Manajemen Event</h3>
                    </div>
                </div>

                <!-- Produk -->
                <div onclick="alert('Navigasi ke Produk')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Produk</h3>
                    </div>
                </div>

                <!-- Banner -->
                <div onclick="alert('Navigasi ke Banner')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-image"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Banner</h3>
                    </div>
                </div>

                <!-- Kelola Lokasi -->
                <div onclick="alert('Navigasi ke Kelola Lokasi')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Kelola Lokasi</h3>
                    </div>
                </div>

                <!-- Running Text -->
                <div onclick="alert('Navigasi ke Running Text')" class="bg-white hover:border-emerald-500 hover:shadow-md border border-slate-200 p-6 rounded-xl transition flex flex-col items-center text-center space-y-3 cursor-pointer group">
                    <div class="w-12 h-12 bg-slate-50 text-slate-700 rounded-xl flex items-center justify-center text-xl group-hover:scale-110 group-hover:text-emerald-600 transition">
                        <i class="fa-solid fa-bars-staggered"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-slate-900 tracking-wide">Running Text</h3>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Skrip Pemuat Layout Anti-Kedip (Cached) -->
    <script>
        window._cachedLayout = window._cachedLayout || null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (!window._cachedLayout) {
                    const response = await fetch('../layout.html');
                    window._cachedLayout = await response.text();
                }
                
                document.getElementById('layout-container').innerHTML = window._cachedLayout;

                const payload = document.getElementById('spaAppContainer').innerHTML;
                const mainArea = document.getElementById('mainContentArea') || document.getElementById('main-content');
                if (mainArea) {
                    mainArea.innerHTML = payload;
                }

                // Tandai menu aktif di sidebar
                const currentPath = window.location.pathname;
                const navLinks = document.querySelectorAll('aside a, nav a');
                navLinks.forEach(link => {
                    const href = link.getAttribute('href');
                    if (href && (href.includes('manajemen') || currentPath.includes('manajemen'))) {
                        link.className = "flex items-center space-x-3 px-3 py-2.5 rounded-none bg-emerald-700 text-white font-semibold text-xs shadow-sm transition-all";
                    }
                });

                if (typeof updateDbStatus === 'function') updateDbStatus('db-status');
            } catch (err) {
                console.error("Gagal memuat layout pusat:", err);
            }
        });
    </script>
</body>
</html>
