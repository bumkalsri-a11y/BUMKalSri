                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }

            document.getElementById('bannerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('bannerTitle').value.trim();
                const status = document.getElementById('bannerStatus').value;
                const fileInput = document.getElementById('bannerImage');

                if (!title || fileInput.files.length === 0) return;

                const file = fileInput.files[0];
                const reader = new FileReader();

                reader.onload = function(uploadEvent) {
                    const img = new Image();
                    img.src = uploadEvent.target.result;
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 300;

                        if (width > height) {
                            if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                        } else {
                            if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                        try {
                            await firebase.firestore().collection("banner").add({
                                judul: title,
                                status: status,
                                image: compressedBase64,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });

                            closeBannerModal();
                            document.getElementById('bannerForm').reset();
                            showBannerNotification(`Banner '${title}' berhasil disimpan!`, "success");
                        } catch (error) {
                            alert("Gagal menyimpan ke database: " + error.message);
                        }
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        initBannerPage();
    })();
