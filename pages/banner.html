<!-- KONTEN UTAMA HALAMAN BANNER -->
<div class="space-y-4 pb-20">
    <div class="bg-emerald-700 text-white p-5 rounded-none shadow-sm flex items-center justify-between">
        <div class="space-y-1">
            <h3 class="text-sm font-bold uppercase tracking-wide">Manajemen Banner</h3>
            <p class="text-xs text-emerald-100">Unggah dan kelola gambar banner promosi yang tampil di halaman utama.</p>
        </div>
        <div>
            <button type="button" onclick="openBannerModal()" class="bg-white/10 hover:bg-white/20 text-white px-3.5 py-2 rounded-none text-xs font-semibold transition-all border border-white/20 flex items-center space-x-2 cursor-pointer shadow-sm">
                <i class="fa-solid fa-panorama text-sm"></i>
                <span>+ Tambah Banner</span>
            </button>
        </div>
    </div>

    <!-- STYLING CSS UTILITY UNTUK MENYEMBUNYIKAN SCROLLBAR TETAPI TETAP BISA DI-SCROLL -->
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none !important; width: 0px !important; height: 0px !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>

    <!-- Kontainer Banner dengan Perbaikan Kelas Grid & Tinggi Kontainer -->
    <div class="universal-banner-container no-scrollbar w-full overflow-y-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 pr-1">
        <div class="p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs col-span-full">
            Memuat data banner...
        </div>
    </div>
</div>

<script>
    (function() {
        let currentDeleteBannerId = null;
        let currentEditBannerId = null;

        function initBannerPage() {
            initBannerModals();
            loadBannerData();
        }

        function loadBannerData() {
            const containers = document.querySelectorAll('.universal-banner-container');
            if (!containers.length) return;

            if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length || !firebase.firestore) {
                setTimeout(loadBannerData, 200);
                return;
            }

            if (typeof window._bannerUnsub === 'function') {
                window._bannerUnsub();
            }

            try {
                window._bannerUnsub = firebase.firestore().collection("banner")
                    .onSnapshot((snapshot) => {
                        let htmlContent = '';
                        if (snapshot.empty) {
                            htmlContent = `
                                <div class="p-6 bg-slate-50 dark:bg-slate-700/50 rounded-none border border-slate-200/70 dark:border-slate-700 shadow-sm text-center text-slate-400 text-xs col-span-full">
                                    Belum ada data banner di database.
                                </div>`;
                        } else {
                            snapshot.forEach((docSnap) => {
                                const item = docSnap.data();
                                const id = docSnap.id;
                                const judul = item.judul || '-';
                                const status = item.status || 'Aktif';
                                const image = item.image || '';

                                const safeJudul = judul.replace(/'/g, "\\'");

                                htmlContent += `
                                    <div class="p-4 bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm space-y-3 flex flex-col justify-between">
                                        <div>
                                            <div class="w-full h-32 bg-slate-100 dark:bg-slate-900 rounded-none overflow-hidden flex items-center justify-center text-slate-400 border border-slate-200 dark:border-slate-700">
                                                ${image ? `<img src="${image}" class="w-full h-full object-cover">` : '<i class="fa-solid fa-image text-2xl"></i>'}
                                            </div>
                                            <div class="mt-2">
                                                <span class="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-400 font-semibold text-[10px] uppercase">${status}</span>
                                                <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs mt-1">${judul}</h4>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-2 pt-2 border-t border-slate-100 dark:border-slate-700">
                                            <button type="button" onclick="openEditBannerModal('${id}', '${safeJudul}', '${status}')" class="flex-1 py-1.5 bg-blue-50 dark:bg-slate-900 text-blue-600 rounded-none text-xs font-medium transition cursor-pointer">Edit</button>
                                            <button type="button" onclick="openConfirmDeleteBannerModal('${id}', '${safeJudul}')" class="flex-1 py-1.5 bg-red-50 dark:bg-slate-900 text-red-600 rounded-none text-xs font-medium transition cursor-pointer">Hapus</button>
                                        </div>
                                    </div>
                                `;
                            });
                        }

                        containers.forEach(c => c.innerHTML = htmlContent);
                    }, (err) => {
                        console.error("Error mengambil banner:", err);
                        containers.forEach(c => c.innerHTML = `<div class="p-6 text-center text-red-500 text-xs col-span-full">Gagal memuat data banner: ${err.message}</div>`);
                    });
            } catch (err) {
                console.error("Firestore Error:", err);
                setTimeout(loadBannerData, 300);
            }
        }

        window.openBannerModal = function() {
            currentEditBannerId = null;
            initBannerModals();
            const modalTitle = document.getElementById('modalBannerTitle');
            const submitBtn = document.getElementById('submitBannerBtn');
            const form = document.getElementById('bannerForm');

            if (modalTitle) modalTitle.innerText = "Form Input Banner";
            if (submitBtn) submitBtn.innerText = "Simpan Banner";
            if (form) form.reset();

            const imgInput = document.getElementById('bannerImage');
            if (imgInput) imgInput.setAttribute('required', 'required');

            const modal = document.getElementById('customBannerModal');
            const box = document.getElementById('customBannerBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    box.classList.remove('scale-95', 'opacity-0');
                    box.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        };

        window.openEditBannerModal = function(id, title, status) {
            currentEditBannerId = id;
            initBannerModals();
            
            const modalTitle = document.getElementById('modalBannerTitle');
            const submitBtn = document.getElementById('submitBannerBtn');
            const titleInput = document.getElementById('bannerTitle');
            const statusSelect = document.getElementById('bannerStatus');
            const imgInput = document.getElementById('bannerImage');

            if (modalTitle) modalTitle.innerText = "Form Edit Banner";
            if (submitBtn) submitBtn.innerText = "Perbarui Banner";
            if (titleInput) titleInput.value = title;
            if (statusSelect) statusSelect.value = status;
            if (imgInput) imgInput.removeAttribute('required');

            const modal = document.getElementById('customBannerModal');
            const box = document.getElementById('customBannerBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    box.classList.remove('scale-95', 'opacity-0');
                    box.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        };

        window.closeBannerModal = function() {
            const modal = document.getElementById('customBannerModal');
            const box = document.getElementById('customBannerBox');
            if (modal && box) {
                box.classList.remove('scale-100', 'opacity-100');
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { 
                    modal.classList.add('hidden'); 
                    currentEditBannerId = null;
                }, 300);
            }
        };

        window.openConfirmDeleteBannerModal = function(id, bannerTitle) {
            initBannerModals();
            currentDeleteBannerId = id;
            const msg = document.getElementById('deleteMessageText');
            if (msg) msg.innerText = `Apakah Anda yakin ingin menghapus "${bannerTitle}"?`;

            const modal = document.getElementById('customDeleteModal');
            const box = document.getElementById('customDeleteBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    box.classList.remove('scale-95', 'opacity-0');
                    box.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        };

        window.closeConfirmDeleteModal = function() {
            const modal = document.getElementById('customDeleteModal');
            const box = document.getElementById('customDeleteBox');
            if (modal && box) {
                box.classList.remove('scale-100', 'opacity-100');
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    currentDeleteBannerId = null;
                }, 300);
            }
        };

        window.showBannerNotification = function(message, type = 'success') {
            initBannerModals();
            const msgEl = document.getElementById('notifMessageText');
            const titleEl = document.getElementById('notifTitleText');
            const iconEl = document.getElementById('notifIconContainer');

            if (msgEl) msgEl.innerText = message;
            if (titleEl) titleEl.innerText = type === 'success' ? 'Berhasil' : 'Informasi';
            if (iconEl) {
                iconEl.className = "w-12 h-12 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg";
                iconEl.innerHTML = '<i class="fa-solid fa-check"></i>';
            }

            const modal = document.getElementById('customNotificationModal');
            const box = document.getElementById('customNotificationBox');
            if (modal && box) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    box.classList.remove('scale-95', 'opacity-0');
                    box.classList.add('scale-100', 'opacity-100');
                }, 10);
            }
        };

        window.closeBannerNotification = function() {
            const modal = document.getElementById('customNotificationModal');
            const box = document.getElementById('customNotificationBox');
            if (modal && box) {
                box.classList.remove('scale-100', 'opacity-100');
                box.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        };

        function initBannerModals() {
            if (document.getElementById('customBannerModal')) return;

            const modalsHTML = `
            <div id="customBannerModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-[9999] flex items-center justify-center hidden p-4">
                <div id="customBannerBox" class="w-full max-w-md bg-white dark:bg-slate-800 rounded-none shadow-2xl flex flex-col pointer-events-auto border border-slate-200 dark:border-slate-700 p-5 space-y-4 transform scale-95 opacity-0 transition-all duration-300 ease-out">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-700">
                        <h3 id="modalBannerTitle" class="font-bold text-slate-800 dark:text-slate-100 text-xs uppercase tracking-wide">Form Input Banner</h3>
                        <button type="button" onclick="closeBannerModal()" class="w-6 h-6 rounded-none bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200 flex items-center justify-center text-xs cursor-pointer">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <form id="bannerForm" class="space-y-3 text-xs">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Judul Banner</label>
                            <input type="text" id="bannerTitle" required placeholder="Contoh: Promo Wisata Desa" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">File Gambar Banner (Kompres Otomatis 300px)</label>
                            <input type="file" id="bannerImage" accept="image/*" class="w-full text-xs text-slate-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-none file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 dark:file:bg-emerald-950/40 dark:file:text-emerald-400 hover:file:bg-emerald-100 cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Status Publikasi</label>
                            <select id="bannerStatus" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                                <option value="Aktif">Aktif</option>
                                <option value="Non-Aktif">Non-Aktif</option>
                            </select>
                        </div>
                        <div class="flex space-x-2 pt-2">
                            <button type="button" onclick="closeBannerModal()" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                            <button type="submit" id="submitBannerBtn" class="w-1/2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Simpan Banner</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="customDeleteModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-[9999] flex items-center justify-center hidden p-4">
                <div id="customDeleteBox" class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-none shadow-2xl flex flex-col pointer-events-auto border border-slate-200 dark:border-slate-700 p-5 space-y-4 transform scale-95 opacity-0 transition-all duration-300 ease-out text-center">
                    <div class="w-12 h-12 bg-red-100 dark:bg-red-950/50 text-red-600 rounded-full flex items-center justify-center mx-auto text-lg">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Konfirmasi Hapus</h3>
                        <p id="deleteMessageText" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Apakah Anda yakin ingin menghapus item ini?</p>
                    </div>
                    <div class="flex space-x-2 pt-2">
                        <button type="button" onclick="closeConfirmDeleteModal()" class="w-1/2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-200 font-semibold py-2 rounded-none transition-all text-xs cursor-pointer">Batal</button>
                        <button type="button" id="confirmDeleteBtn" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">Hapus</button>
                    </div>
                </div>
            </div>

            <div id="customNotificationModal" class="fixed inset-0 bg-slate-950/50 backdrop-blur-xs z-[10000] flex items-center justify-center hidden p-4">
                <div id="customNotificationBox" class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-none shadow-2xl flex flex-col pointer-events-auto border border-slate-200 dark:border-slate-700 p-5 space-y-4 transform scale-95 opacity-0 transition-all duration-300 ease-out text-center">
                    <div id="notifIconContainer" class="w-12 h-12 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div>
                        <h3 id="notifTitleText" class="font-bold text-slate-800 dark:text-slate-100 text-sm">Informasi</h3>
                        <p id="notifMessageText" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Pesan berhasil.</p>
                    </div>
                    <div class="pt-2">
                        <button type="button" onclick="closeBannerNotification()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">OK</button>
                    </div>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalsHTML);

            document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
                if (!currentDeleteBannerId) return;
                try {
                    await firebase.firestore().collection("banner").doc(currentDeleteBannerId).delete();
                    closeConfirmDeleteModal();
                    showBannerNotification("Banner berhasil dihapus dari database!", "success");
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            });

            document.getElementById('bannerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('bannerTitle').value.trim();
                const status = document.getElementById('bannerStatus').value;
                const fileInput = document.getElementById('bannerImage');

                if (!title) return;

                const saveData = async (imageBase64 = null) => {
                    try {
                        const docRef = currentEditBannerId 
                            ? firebase.firestore().collection("banner").doc(currentEditBannerId)
                            : firebase.firestore().collection("banner").doc();

                        const payload = {
                            judul: title,
                            status: status
                        };

                        if (imageBase64) {
                            payload.image = imageBase64;
                        }

                        if (!currentEditBannerId) {
                            payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                        }

                        if (currentEditBannerId) {
                            await docRef.update(payload);
                        } else {
                            await docRef.set(payload);
                        }

                        closeBannerModal();
                        document.getElementById('bannerForm').reset();
                        showBannerNotification(`Banner '${title}' berhasil ${currentEditBannerId ? 'diperbarui' : 'disimpan'}!`, "success");
                    } catch (error) {
                        alert("Gagal menyimpan ke database: " + error.message);
                    }
                };

                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const reader = new FileReader();

                    reader.onload = function(uploadEvent) {
                        const img = new Image();
                        img.src = uploadEvent.target.result;
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const maxDim = 300;

                            if (width > height) {
                                if (width > maxDim) { height *= maxDim / width; width = maxDim; }
                            } else {
                                if (height > maxDim) { width *= maxDim / height; height = maxDim; }
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                            saveData(compressedBase64);
                        };
                    };
                    reader.readAsDataURL(file);
                } else {
                    if (currentEditBannerId) {
                        saveData(null);
                    } else {
                        alert("Silakan pilih gambar banner terlebih dahulu.");
                    }
                }
            });
        }

        initBannerPage();
    })();
</script>
