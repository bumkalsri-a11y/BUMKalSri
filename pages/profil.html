<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengaturan Profil - BUMKal Sinar Mitra Desa</title>
</head>
<body>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
        }
        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
    </style>

    <!-- CONTAINER UTAMA DESKTOP (PADDING p-4 pb-12 SAMA PERSIS DENGAN UNIT USAHA & HOME) -->
    <div id="spaAppContainer" class="hidden md:flex flex-col space-y-4 overflow-y-auto no-scrollbar h-full w-full p-4 pb-12">
        
        <!-- HEADER HALAMAN DESKTOP -->
        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-white p-6 rounded-none shadow-md border-b border-emerald-950/40 flex justify-between items-center">
            <div class="space-y-1">
                <h2 class="text-xl font-bold tracking-tight">Pengaturan Profil BUMKal</h2>
                <p class="text-xs text-amber-300">Kelola informasi profil, alamat, dan identitas resmi lembaga.</p>
            </div>
            <div class="hidden lg:block text-right">
                <span class="px-3 py-1.5 bg-amber-500/20 text-amber-300 rounded-none text-xs font-semibold border border-amber-400/30">
                    <i class="fa-solid fa-building-user mr-1.5"></i> Profil Utama
                </span>
            </div>
        </div>

        <!-- FORM PROFIL DESKTOP -->
        <div class="p-5 bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm">
            <form id="profilFormDesktop" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Lembaga / Instansi</label>
                        <input type="text" id="profilNamaDesktop" required placeholder="Contoh: BUMKal Sinar Mitra Desa" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Slogan / Tagline</label>
                        <input type="text" id="profilSloganDesktop" placeholder="Contoh: Desa Berdaya, Warga Sejahtera" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Kapanewon / Wilayah</label>
                        <input type="text" id="profilWilayahDesktop" placeholder="Contoh: Pundong, Bantul, Yogyakarta" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Nomor Kontak / WhatsApp</label>
                        <input type="text" id="profilKontakDesktop" placeholder="Contoh: 081234567890" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Alamat Lengkap Kantor</label>
                    <textarea id="profilAlamatDesktop" rows="2" placeholder="Masukkan alamat lengkap kantor BUMKal..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Deskripsi Singkat Lembaga</label>
                    <textarea id="profilDeskripsiDesktop" rows="3" placeholder="Badan Usaha Milik Kalurahan..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-emerald-800 hover:bg-emerald-700 text-white font-semibold px-6 py-2 rounded-none shadow transition-all text-xs cursor-pointer flex items-center space-x-2">
                        <i class="fa-solid fa-floppy-disk text-amber-300"></i>
                        <span>Simpan Profil</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- CONTAINER UTAMA MOBILE (PADDING p-3 pb-24 SAMA PERSIS DENGAN UNIT USAHA & HOME) -->
    <div id="spaAppContainerMobile" class="flex md:hidden flex-col space-y-4 overflow-y-auto no-scrollbar h-full w-full p-3 pb-24">
        
        <!-- HEADER HALAMAN MOBILE -->
        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-white p-4 rounded-none shadow-md border-b border-emerald-950/40">
            <h2 class="text-sm font-bold tracking-tight">Pengaturan Profil</h2>
            <p class="text-[10px] text-amber-300 mt-0.5">Kelola identitas resmi BUMKal</p>
        </div>

        <!-- FORM PROFIL MOBILE -->
        <div class="p-4 bg-white dark:bg-slate-800 rounded-none border border-slate-200 dark:border-slate-700 shadow-sm">
            <form id="profilFormMobile" class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Nama Lembaga / Instansi</label>
                    <input type="text" id="profilNamaMobile" required placeholder="Contoh: BUMKal Sinar Mitra Desa" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Slogan / Tagline</label>
                    <input type="text" id="profilSloganMobile" placeholder="Contoh: Desa Berdaya, Warga Sejahtera" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Kapanewon / Wilayah</label>
                    <input type="text" id="profilWilayahMobile" placeholder="Contoh: Pundong, Bantul, Yogyakarta" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Nomor Kontak / WhatsApp</label>
                    <input type="text" id="profilKontakMobile" placeholder="Contoh: 081234567890" class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Alamat Lengkap Kantor</label>
                    <textarea id="profilAlamatMobile" rows="2" placeholder="Masukkan alamat kantor..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Deskripsi Singkat Lembaga</label>
                    <textarea id="profilDeskripsiMobile" rows="3" placeholder="Badan Usaha Milik Kalurahan..." class="w-full px-3 py-2 rounded-none border border-slate-200 dark:border-slate-600 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-floppy-disk text-amber-300"></i>
                        <span>Simpan Profil</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SKRIP LOGIKA PROFIL FIRESTORE -->
    <script>
        (function() {
            function initProfilPage() {
                initProfilModals();
                loadProfilData();
                bindProfilFormEvents();
            }

            function loadProfilData() {
                if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length || !firebase.firestore) {
                    setTimeout(loadProfilData, 200);
                    return;
                }

                firebase.firestore().collection("pengaturan_profil").doc("informasi").get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        ['Desktop', 'Mobile'].forEach(mode => {
                            const setVal = (id, val) => {
                                const el = document.getElementById(id + mode);
                                if (el) el.value = val || '';
                            };
                            setVal('profilNama', data.nama);
                            setVal('profilSlogan', data.slogan);
                            setVal('profilWilayah', data.wilayah);
                            setVal('profilKontak', data.kontak);
                            setVal('profilAlamat', data.alamat);
                            setVal('profilDeskripsi', data.deskripsi);
                        });
                    }
                }).catch((err) => {
                    console.error("Gagal memuat profil:", err);
                });
            }

            window.showProfilNotification = function(message) {
                initProfilModals();
                const msgEl = document.getElementById('profilNotifMessageText');
                if (msgEl) msgEl.innerText = message;

                const modal = document.getElementById('customProfilNotificationModal');
                const box = document.getElementById('customProfilNotificationBox');
                if (modal && box) {
                    modal.classList.remove('hidden');
                    setTimeout(() => {
                        box.classList.remove('scale-95', 'opacity-0');
                        box.classList.add('scale-100', 'opacity-100');
                    }, 10);
                }
            };

            window.closeProfilNotification = function() {
                const modal = document.getElementById('customProfilNotificationModal');
                const box = document.getElementById('customProfilNotificationBox');
                if (modal && box) {
                    box.classList.remove('scale-100', 'opacity-100');
                    box.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => { modal.classList.add('hidden'); }, 300);
                }
            };

            function initProfilModals() {
                if (document.getElementById('customProfilNotificationModal')) return;

                const modalHTML = `
                <div id="customProfilNotificationModal" class="fixed inset-0 bg-slate-950/50 backdrop-blur-xs z-[10000] flex items-center justify-center hidden p-4">
                    <div id="customProfilNotificationBox" class="w-full max-w-sm bg-white dark:bg-slate-800 rounded-none shadow-2xl flex flex-col pointer-events-auto border border-slate-200 dark:border-slate-700 p-5 space-y-4 transform scale-95 opacity-0 transition-all duration-300 ease-out text-center">
                        <div class="w-12 h-12 bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-lg">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Berhasil</h3>
                            <p id="profilNotifMessageText" class="text-xs text-slate-500 dark:text-slate-400 mt-1">Profil berhasil disimpan.</p>
                        </div>
                        <div class="pt-2">
                            <button type="button" onclick="closeProfilNotification()" class="w-full bg-emerald-800 hover:bg-emerald-700 text-white font-semibold py-2 rounded-none shadow transition-all text-xs cursor-pointer">OK</button>
                        </div>
                    </div>
                </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
            }

            function bindProfilFormEvents() {
                const handleSave = async (e, mode) => {
                    e.preventDefault();
                    const getVal = (id) => (document.getElementById(id + mode) ? document.getElementById(id + mode).value.trim() : '');

                    const nama = getVal('profilNama');
                    const slogan = getVal('profilSlogan');
                    const wilayah = getVal('profilWilayah');
                    const kontak = getVal('profilKontak');
                    const alamat = getVal('profilAlamat');
                    const deskripsi = getVal('profilDeskripsi');

                    try {
                        await firebase.firestore().collection("pengaturan_profil").doc("informasi").set({
                            nama,
                            slogan,
                            wilayah,
                            kontak,
                            alamat,
                            deskripsi,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });

                        showProfilNotification("Profil lembaga berhasil diperbarui!");
                        if (typeof window.loadGlobalProfileHeader === 'function') {
                            window.loadGlobalProfileHeader();
                        }
                    } catch (error) {
                        alert("Gagal menyimpan profil: " + error.message);
                    }
                };

                const formDesktop = document.getElementById('profilFormDesktop');
                const formMobile = document.getElementById('profilFormMobile');

                if (formDesktop) formDesktop.addEventListener('submit', (e) => handleSave(e, 'Desktop'));
                if (formMobile) formMobile.addEventListener('submit', (e) => handleSave(e, 'Mobile'));
            }

            setTimeout(initProfilPage, 50);
        })();
    </script>
</body>
</html>
