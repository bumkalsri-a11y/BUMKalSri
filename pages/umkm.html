<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">UMKM - BUMKal Srihardono</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- File Konfigurasi -->
    <script src="../firebase.js"></script>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between font-sans select-none">

    <!-- Tempat Layout di Root Dimuat -->
    <div id="layout-container" class="contents"></div>

    <!-- KONTEN KHUSUS UMKM (Tahap Pengembangan) -->
    <div id="content-payload" class="hidden">
        <div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 space-y-4">
            <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center text-3xl shadow-sm animate-pulse">
                🏪
            </div>
            <div class="space-y-2 max-w-md mx-auto">
                <span class="text-[10px] font-bold uppercase tracking-widest bg-amber-100 text-amber-800 px-3 py-1 rounded-full border border-amber-200">
                    Segera Hadir
                </span>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Direktori & Potensi UMKM</h2>
                <p class="text-xs text-slate-500 leading-relaxed">
                    Halaman direktori dan pendataan UMKM Kapanewon Pundong sedang dalam tahap pengembangan sistem. Terima kasih atas kesabaran Anda.
                </p>
            </div>
            <div class="pt-2">
                <a href="../home.html" class="inline-flex items-center space-x-2 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    <span>Kembali ke Beranda</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Skrip Pemuat Layout Anti-Kedip (Cached) -->
    <script>
        window._cachedLayout = window._cachedLayout || null;

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Ambil layout sekali saja lalu simpan di memori browser
                if (!window._cachedLayout) {
                    const response = await fetch('../layout.html');
                    window._cachedLayout = await response.text();
                }
                
                document.getElementById('layout-container').innerHTML = window._cachedLayout;

                // Masukkan isi konten ke dalam <main id="main-content">
                const payload = document.getElementById('content-payload').innerHTML;
                document.getElementById('main-content').innerHTML = payload;

                // Tandai menu aktif di header
                const navLinks = document.querySelectorAll('nav a');
                navLinks.forEach(link => {
                    if(link.getAttribute('href').includes('umkm')) {
                        link.className = "text-emerald-700 font-semibold transition py-1 border-b-2 border-emerald-600";
                    }
                });

                if (typeof updateDbStatus === 'function') updateDbStatus('db-status');
            } catch (err) {
                console.error("Gagal memuat layout pusat:", err);
            }
        });
    </script>
</body>
</html>
