<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none !important; width: 0px !important; height: 0px !important; }
        .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
        body { opacity: 0; transition: opacity 0.2s ease-in-out; }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();

        window.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '1';
        });

        window.toggleTheme = function() {
            const htmlElement = document.documentElement;
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        };

        // Fungsi untuk menyembunyikan/menampilkan sidebar desktop
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('desktopSidebar');
            if (sidebar) {
                sidebar.classList.toggle('w-64');
                sidebar.classList.toggle('w-20');
                
                // Toggle visibilitas teks di dalam sidebar
                sidebar.querySelectorAll('.sidebar-text').forEach(el => {
                    el.classList.toggle('hidden');
                });
            }
        };
    </script>
</head>
<body class="bg-slate-900 font-['Inter'] h-screen overflow-hidden m-0 flex flex-col items-center justify-center">

    <!-- TAMPILAN MOBILE -->
    <div class="flex md:hidden w-full h-screen sm:max-w-[400px] sm:h-[92vh] sm:max-h-[820px] bg-slate-50 dark:bg-slate-900 sm:rounded-none shadow-2xl flex-col justify-between relative sm:border-[6px] sm:border-slate-800">

        <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-900 text-white px-4 pt-3 pb-3 shrink-0 relative flex items-center justify-between border-b border-emerald-950/40 shadow-md">

                    🌿
                </div>
                <div class="overflow-hidden">
                    <h2 class="text-xs font-bold truncate leading-tight text-white">BUMKal Sinar Mitra Desa</h2>
                    <p class="text-[9px] text-amber-300 font-medium truncate" id="header-alamat-mobile">Memuat alamat...</p>

            <div class="flex items-center space-x-2 shrink-0 relative">

                <button onclick="toggleProfileDropdown(event)" class="w-8 h-8 rounded-full bg-amber-500 text-white flex items-center justify-center text-xs font-bold shadow-md cursor-pointer hover:bg-amber-600 transition">

                <!-- DROPDOWN MENU PROFIL -->

                    <div id="absensiMenuContainer">
                        <a href="layout.html?page=absensi" class="flex items-center space-x-2.5 px-3 py-2 rounded-none hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-medium transition">

        <!-- CONTAINER KONTEN DINAMIS MOBILE (PADDING DIATUR PENUH UNTUK KESESUAIAN SEAMLESS) -->

            <!-- Konten dinamis mobile dimuat di sini -->

        <!-- MENU NAVIGASI BAWAH (BOTTOM NAVIGATION) -->
        <div id="nav-container" class="absolute bottom-0 left-0 right-0 z-40"></div>

    <!-- SKRIP SPA ROUTER UTAMA -->
    <script type="module">
        import { renderNavigation } from "./assets/js/navigation.js";

        window._cachedLayout = window._cachedLayout || null;

        window.loadGlobalProfileHeader = function() {
            if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length || !firebase.firestore) {
                setTimeout(loadGlobalProfileHeader, 100);
                return;
            }

            const db = firebase.firestore();
            db.collection("pengaturan_profil").doc("informasi").get().then((doc) => {
                if (doc && doc.exists) {
                    const data = doc.data();
                    const alamatVal = data.alamat || "";
                    const kontakVal = data.kontak || "";
                    
                    const alamatMobileEl = document.getElementById('header-alamat-mobile');
                    if (alamatMobileEl && alamatVal) {
                        alamatMobileEl.innerText = alamatVal;
                    }

                    const alamatDesktopEl = document.getElementById('header-alamat-desktop');
                    if (alamatDesktopEl && alamatVal) {
                        alamatDesktopEl.innerText = alamatVal;
                    }

                    const kontakDesktopEl = document.getElementById('header-kontak-desktop');
                    if (kontakDesktopEl && kontakVal) {
                        kontakDesktopEl.innerText = kontakVal;
                    }
                }
            }).catch(e => console.log(e));
        };

        window.loadPageContent = async function(targetUrl) {
            try {
                if (targetUrl) {
                    window.history.pushState({}, '', targetUrl);
                }

                const urlParams = new URLSearchParams(window.location.search);
                const page = urlParams.get('page') || 'home'; 
                
                let fileName = '';
                if (page === 'home') {
                    fileName = './home.html';
                } else {
                    fileName = `./pages/${page}.html`;
                }

                const response = await fetch(fileName);
                if (!response.ok) throw new Error("Halaman tidak ditemukan: " + fileName);
                const html = await response.text();
                
                const parser = new DOMParser();
                const docParsed = parser.parseFromString(html, 'text/html');
                
                const mainArea = document.getElementById('mainContentArea');
                const mainAreaMobile = document.getElementById('mainContentAreaMobile');
                
                const desktopPayload = docParsed.getElementById('spaAppContainer');
                const mobilePayload = docParsed.getElementById('spaAppContainerMobile');

                if (desktopPayload && mainArea) {
                    mainArea.innerHTML = desktopPayload.outerHTML;
                } else if (mainArea) {
                    mainArea.innerHTML = docParsed.body.innerHTML;
                }

                if (mobilePayload && mainAreaMobile) {
                    mainAreaMobile.innerHTML = mobilePayload.outerHTML;
                } else if (mainAreaMobile) {
                    mainAreaMobile.innerHTML = docParsed.body.innerHTML;
                }

                document.querySelectorAll('script[data-dynamic-script]').forEach(el => el.remove());
                docParsed.querySelectorAll('script').forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.setAttribute('data-dynamic-script', 'true');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                });

                document.querySelectorAll('#desktopSidebar a').forEach(el => {
                    el.className = "flex items-center space-x-3 px-3 py-2.5 rounded-none hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-medium text-xs transition-all";
                    if (el.getAttribute('href') && el.getAttribute('href').includes(`page=${page}`)) {
                        el.className = "flex items-center space-x-3 px-3 py-2.5 rounded-none bg-emerald-700 text-white font-semibold text-xs shadow-sm transition-all";
                    }
                });

                const navContainerEl = document.getElementById('nav-container');
                if (navContainerEl) {
                    navContainerEl.innerHTML = renderNavigation(page, true, window.currentUserRole || 'warga');
                }

                window.loadGlobalProfileHeader();

            } catch (error) {
                console.error("Gagal memuat halaman:", error);
                const mainArea = document.getElementById('mainContentArea');
                const mainAreaMobile = document.getElementById('mainContentAreaMobile');
                if (mainArea) mainArea.innerHTML = `<div class="p-8 text-center text-red-500 text-xs">Halaman gagal dimuat.</div>`;
                if (mainAreaMobile) mainAreaMobile.innerHTML = `<div class="p-8 text-center text-red-500 text-xs">Halaman gagal dimuat.</div>`;
            }
        };

        window.toggleProfileDropdown = function(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown) {
                dropdown.classList.toggle('hidden');
            }
        };

        document.addEventListener('click', () => {
            const dropdown = document.getElementById('profileDropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        });

        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (link && link.href && link.href.includes('layout.html?page=')) {
                e.preventDefault();
                loadPageContent(link.href);
            }
        });

        window.addEventListener('popstate', () => {
            loadPageContent();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof updateDbStatus === 'function') updateDbStatus('db-status');
            window.loadGlobalProfileHeader();

            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    const name = user.displayName || "Pengurus BUMKal";
                    const email = user.email || "";
                    document.getElementById('userName').innerText = name;
                    document.getElementById('userEmail').innerText = email;
                    
                    const initial = name.charAt(0).toUpperCase();
                    document.getElementById('userInitial').innerText = initial;
                    
                    const userInitialDropdown = document.getElementById('userInitialDropdown');
                    if (userInitialDropdown) userInitialDropdown.innerText = initial;

                    window.currentUserRole = 'admin';

                    const absensiContainer = document.getElementById('absensiMenuContainer');
                    if (absensiContainer) {
                        if (window.currentUserRole.toLowerCase() === 'tamu') {
                            absensiContainer.classList.add('hidden');
                        } else {
                            absensiContainer.classList.remove('hidden');
                        }
                    }

                    loadPageContent(); 
                } else {
                    window.location.replace("./index.html");
                }
            });
        });

        window.logoutApp = function() {
            if(confirm("Keluar dari sistem BUMKal?")) {
                firebase.auth().signOut().then(() => {
                    window.location.replace("./index.html");
                });
            }
        };
    </script>
