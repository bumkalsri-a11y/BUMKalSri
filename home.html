<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Beranda - BUMKal Srihardono</title>
</head>
<body>
    <!-- Konten Khusus Beranda -->
    <div id="content-payload">
        <!-- KONTAINER SLIDER BANNER (Tinggi Dikecilkan & Menggunakan Class Selector) -->
        <div class="hero-slider-box relative bg-slate-900 text-white min-h-[320px] rounded-2xl flex flex-col items-center justify-center text-center p-4 overflow-hidden shadow-sm group">
            
            <!-- BACKGROUND BLUR (Untuk mengisi ruang samping tanpa merusak gambar) -->
            <div class="hero-slider-bg-blur absolute inset-0 bg-cover bg-center filter blur-xl opacity-30 scale-110 transition-all duration-700 ease-in-out"></div>
            
            <!-- GAMBAR BANNER UTAMA (Ukuran Asli & Tidak Pecah) -->
            <div class="relative z-10 my-2 max-h-[160px] max-w-[280px] sm:max-w-[320px] rounded-lg overflow-hidden shadow-lg border border-white/10 flex items-center justify-center bg-slate-950/40">
                <img class="hero-banner-img max-h-[160px] w-auto object-contain transition-all duration-500" src="" alt="Banner BUMKal">
            </div>
            
            <!-- OVERLAY GRADIENT BAWAH -->
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-900/40 to-slate-950/40 pointer-events-none"></div>
            
            <!-- TULISAN & INFORMASI BANNER -->
            <div class="relative z-10 max-w-xl mx-auto space-y-1.5 mt-1">
                <span class="text-[10px] uppercase tracking-widest text-emerald-400 font-bold bg-emerald-950/70 px-2.5 py-0.5 rounded-full border border-emerald-500/30 inline-block transition-all duration-300">
                    Pundong, Bantul, Yogyakarta
                </span>
                <h2 class="text-xl md:text-3xl font-extrabold tracking-tight drop-shadow-md">
                    <span class="banner-title-text">Memuat Banner...</span> 
                    <span class="inline-block text-emerald-400 font-serif italic font-normal ml-1">BUMKal Srihardono</span>
                </h2>
                <p class="text-[11px] md:text-xs text-slate-300 max-w-md mx-auto leading-relaxed transition-all duration-300">
                    Pusat layanan digital desa & ekonomi kreatif Kapanewon Pundong.
                </p>
            </div>

            <!-- NAVIGASI PANAH (PREV & NEXT) -->
            <button type="button" onclick="prevHomeSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 z-20 w-8 h-8 bg-black/40 hover:bg-black/70 text-white rounded-full flex items-center justify-center backdrop-blur-xs transition opacity-0 group-hover:opacity-100 cursor-pointer">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <button type="button" onclick="nextHomeSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 z-20 w-8 h-8 bg-black/40 hover:bg-black/70 text-white rounded-full flex items-center justify-center backdrop-blur-xs transition opacity-0 group-hover:opacity-100 cursor-pointer">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>

            <!-- INDIKATOR TITIK (DOTS) -->
            <div class="hero-slider-dots absolute bottom-2 left-0 right-0 z-20 flex justify-center space-x-1.5"></div>
        </div>
    </div>

    <!-- SKRIP KONTROL SLIDER & FIRESTORE REALTIME -->
    <script>
        (function() {
            let slideIndex = 0;
            let slideTimer = null;
            let slideData = [];

            function initHomeSlider() {
                loadFirestoreBanners();
            }

            function loadFirestoreBanners() {
                if (typeof firebase === 'undefined' || !firebase.apps || !firebase.apps.length || !firebase.firestore) {
                    setTimeout(loadFirestoreBanners, 200);
                    return;
                }

                firebase.firestore().collection("banner").onSnapshot((snapshot) => {
                    const fetchedSlides = [];
                    snapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        if (data.status === 'Aktif' || !data.status) {
                            fetchedSlides.push({
                                judul: data.judul || 'Selamat Datang',
                                image: data.image || 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600&auto=format&fit=crop'
                            });
                        }
                    });

                    if (fetchedSlides.length > 0) {
                        slideData = fetchedSlides;
                    } else {
                        slideData = [{
                            judul: "Selamat Datang",
                            image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600&auto=format&fit=crop"
                        }];
                    }
                    
                    slideIndex = 0;
                    renderSlide(slideIndex);
                    startAutoSlide();
                }, (err) => {
                    console.error("Gagal memuat banner beranda:", err);
                    slideData = [{
                        judul: "Selamat Datang",
                        image: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1600&auto=format&fit=crop"
                    }];
                    renderSlide(0);
                    startAutoSlide();
                });
            }

            function renderSlide(index) {
                const imgElements = document.querySelectorAll('.hero-banner-img');
                const bgBlurElements = document.querySelectorAll('.hero-slider-bg-blur');
                const titleElements = document.querySelectorAll('.banner-title-text');
                const dotsElements = document.querySelectorAll('.hero-slider-dots');

                if (!imgElements.length || !slideData.length) return;

                const current = slideData[index];
                
                // Update Gambar Banner Utama tanpa Pecah
                imgElements.forEach(imgEl => {
                    imgEl.style.opacity = '0';
                    setTimeout(() => {
                        imgEl.src = current.image;
                        imgEl.style.opacity = '1';
                    }, 150);
                });

                // Update Background Blur di Belakangnya
                bgBlurElements.forEach(bgBlur => {
                    bgBlur.style.backgroundImage = `url('${current.image}')`;
                });

                // Update Judul Banner
                titleElements.forEach(titleEl => {
                    titleEl.innerText = current.judul;
                });

                // Render Indikator Titik (Dots)
                dotsElements.forEach(dotsEl => {
                    let dotsHtml = '';
                    slideData.forEach((_, i) => {
                        dotsHtml += `<button type="button" onclick="goToHomeSlide(${i})" class="w-2 h-2 rounded-full transition-all duration-300 ${i === index ? 'bg-emerald-400 w-5' : 'bg-white/40 hover:bg-white/70'} cursor-pointer"></button>`;
                    });
                    dotsEl.innerHTML = dotsHtml;
                });
            }

            function startAutoSlide() {
                clearInterval(slideTimer);
                if (slideData.length <= 1) return;
                
                slideTimer = setInterval(() => {
                    slideIndex = (slideIndex + 1) % slideData.length;
                    renderSlide(slideIndex);
                }, 4000);
            }

            window.nextHomeSlide = function() {
                if (!slideData.length) return;
                slideIndex = (slideIndex + 1) % slideData.length;
                renderSlide(slideIndex);
                startAutoSlide();
            };

            window.prevHomeSlide = function() {
                if (!slideData.length) return;
                slideIndex = (slideIndex - 1 + slideData.length) % slideData.length;
                renderSlide(slideIndex);
                startAutoSlide();
            };

            window.goToHomeSlide = function(i) {
                slideIndex = i;
                renderSlide(slideIndex);
                startAutoSlide();
            };

            initHomeSlider();
        })();
    </script>
</body>
</html>
